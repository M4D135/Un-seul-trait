name: Publication linea.estrasse.fr

# À chaque push sur main : vérification complète puis compilation.
# Le contenu de dist/ est poussé sur la branche orpheline « site ».
# Le VPS récupère cette branche (deploy/install-vps.sh).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication-site
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Publier dist/ sur la branche site
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -s dist/index.html
          # Domaine personnalisé si la branche sert aussi de source GitHub Pages.
          printf 'linea.estrasse.fr\n' > dist/CNAME
          cd dist
          git init -q -b site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Site compilé depuis ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/site
